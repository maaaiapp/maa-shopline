name: drain-backup
# Secondary trigger for /internal/jobs/drain. Primary is Supabase pg_cron -> pg_net (0003_scheduler.sql).
# GitHub schedules can run late or skip under load; the queue is idempotent, so overlap with pg_cron is safe.
on:
  schedule: [{cron: "*/5 * * * *"}]
  workflow_dispatch: {}
permissions: {}
jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger drain (tolerates Render cold start)
        env:
          DRAIN_URL: ${{ secrets.DRAIN_URL }}
          DRAIN_SECRET: ${{ secrets.DRAIN_SECRET }}
        run: |
          test -n "$DRAIN_URL" && test -n "$DRAIN_SECRET" || { echo "drain secrets not configured"; exit 1; }
          curl -fsS --retry 3 --retry-delay 20 --retry-all-errors --max-time 90 \
            -X POST -H "Authorization: Bearer $DRAIN_SECRET" -H "Content-Type: application/json" \
            -d '{"source":"github"}' "$DRAIN_URL" -o /dev/null -w "%{http_code}\n"
